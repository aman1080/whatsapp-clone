server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/whatsapp_clone?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-secret-at-least-32-bytes}
    expiration-ms: 86400000
